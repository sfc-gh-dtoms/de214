name: 'de214_demo'
version: '1.0.0'
config-version: 2

profile: 'de214_demo'

model-paths: ["models"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  de214_demo:
    staging:
      +materialized: table
    marts:
      +materialized: table
      # Disabled initially: start with no semantic view so the agent answers
      # from the raw mart, then flip to +enabled: true in semantic view section.
      sv_sales_analytics:
        +enabled: true
      sv_customer_analytics:
        +enabled: true