name: Deploy dbt Project

# Deploys the dbt project object to Snowflake and runs it against the PROD
# schema. Deployment is done entirely with the Snowflake CLI (repeatable,
# deterministic) - no AI in the deploy path.

on:
  push:
    branches:
      - main
    paths:
      - 'dbt_project/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_AUTHENTICATOR: PROGRAMMATIC_ACCESS_TOKEN
      SNOWFLAKE_TOKEN_FILE_PATH: ${{ github.workspace }}/.pat_token
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write PAT to file
        run: |
          echo -n "${{ secrets.SNOWFLAKE_PAT }}" > "${{ github.workspace }}/.pat_token"
          chmod 600 "${{ github.workspace }}/.pat_token"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Vendor dbt packages into dbt_packages/ so the deploy is self-contained
      # (no External Access Integration needed inside Snowflake).
      - name: Install dbt and resolve packages
        working-directory: dbt_project
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==1.10.15" "dbt-snowflake==1.10.7"
          dbt deps --profiles-dir .

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0

      - name: Check Snowflake CLI version
        run: snow --version

      # -x is shorthand for --temporary-connection
      - name: Test the Snowflake connection
        run: snow connection test -x

      - name: Deploy the dbt project object to ${{ vars.SNOWFLAKE_DATABASE }}.${{ vars.SNOWFLAKE_SCHEMA }}
        run: snow dbt deploy DE214_DEMO --source dbt_project --force -x

      - name: List dbt project objects
        run: snow dbt list -x

      - name: Run dbt models against PROD
        run: snow dbt execute --dbt-version "1.10.15" -x DE214_DEMO run --target prod

      - name: Run dbt tests against PROD
        run: snow dbt execute --dbt-version "1.10.15" -x DE214_DEMO test --target prod
