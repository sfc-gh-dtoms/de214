name: Semantic View PR Review (Cortex Code)

# On PRs that touch a semantic view model, run Cortex Code in batch mode with the
# project's `semantic-view-authoring` skill to review the change for spec and
# metadata compliance, and post the findings as a PR comment.
#
# NOTE: This is an ADVISORY review only. Deployment is still done exclusively by
# the Snowflake CLI in deploy_dbt_project.yaml - Cortex Code never deploys.
#
# Required repo secrets:
#   SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PAT

on:
  pull_request:
    paths:
      - 'dbt_project/models/marts/sv_*.sql'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need base branch to diff changed files

      - name: Identify changed semantic view models
        id: changed
        run: |
          base="origin/${{ github.base_ref }}"
          files=$(git diff --name-only "$base"...HEAD -- 'dbt_project/models/marts/sv_*.sql' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Changed semantic view files: $files"

      - name: Configure Snowflake connection for Cortex Code
        run: |
          mkdir -p ~/.snowflake
          echo -n "${{ secrets.SNOWFLAKE_PAT }}" > ~/.snowflake/pat_token
          chmod 600 ~/.snowflake/pat_token
          cat > ~/.snowflake/connections.toml <<EOF
          [default]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          authenticator = "PROGRAMMATIC_ACCESS_TOKEN"
          token_file_path = "$HOME/.snowflake/pat_token"
          EOF
          chmod 600 ~/.snowflake/connections.toml

      - name: Install Cortex Code CLI
        run: |
          curl -LsS https://ai.snowflake.com/static/cc-scripts/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Cortex Code semantic view review
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          cortex exec "Use the semantic-view-authoring skill to review the changed semantic view model(s): ${CHANGED_FILES}. Follow the skill's 'PR Review checklist' and output format. Do not modify any files." \
            --allowed "Read,Grep" -o review.md
          echo "----- review.md -----"; cat review.md

      - name: Count pass/fail checks
        id: tally
        run: |
          count_rows() {
            local heading="$1" file="$2" total
            total=$(awk -v h="^## ${heading}" '
              $0 ~ h {flag=1; next}
              /^## / {flag=0}
              flag && /^[[:space:]]*\|/ {c++}
              END {print c+0}
            ' "$file")
            # a real table has a header row + separator row before any data rows
            if [ "$total" -ge 2 ]; then
              echo $((total - 2))
            else
              echo 0
            fi
          }
          pass_count=$(count_rows "Pass" review.md)
          fail_count=$(count_rows "Fail" review.md)
          echo "pass_count=${pass_count}" >> "$GITHUB_OUTPUT"
          echo "fail_count=${fail_count}" >> "$GITHUB_OUTPUT"
          echo "Pass: ${pass_count}  Fail: ${fail_count}"

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const passCount = ${{ steps.tally.outputs.pass_count }};
            const failCount = ${{ steps.tally.outputs.fail_count }};
            const banner = failCount > 0
              ? `### ❌ Semantic view review: ${failCount} check(s) failed, ${passCount} passed\n\n`
              : `### ✅ Semantic view review: all ${passCount} check(s) passed\n\n`;
            let body = '## Semantic View review (Cortex Code)\n\n' + banner;
            try { body += fs.readFileSync('review.md', 'utf8'); }
            catch (e) { body += '_No review output produced._'; }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail job if review found issues
        if: ${{ steps.tally.outputs.fail_count != '0' }}
        run: |
          echo "::error::Semantic view review found ${{ steps.tally.outputs.fail_count }} failing check(s). See PR comment for details."
          exit 1
