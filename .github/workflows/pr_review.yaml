name: Semantic View PR Review (Cortex Code)

# On PRs that touch a semantic view model, run Cortex Code in batch mode with the
# project's `semantic-view-authoring` skill to review the change for spec and
# metadata compliance, and post the findings as a PR comment.
#
# NOTE: This is an ADVISORY review only. Deployment is still done exclusively by
# the Snowflake CLI in deploy_dbt_project.yaml - Cortex Code never deploys.
#
# Required repo secrets:
#   SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PAT
#   (PAT = a programmatic access token for a user with SNOWFLAKE.CORTEX_USER)

on:
  pull_request:
    paths:
      - 'dbt_project/models/marts/sv_*.sql'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need base branch to diff changed files

      - name: Identify changed semantic view models
        id: changed
        run: |
          base="origin/${{ github.base_ref }}"
          files=$(git diff --name-only "$base"...HEAD -- 'dbt_project/models/marts/sv_*.sql' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Changed semantic view files: $files"

      - name: Configure Snowflake connection for Cortex Code
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/connections.toml <<EOF
          [default]
          account = "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          user = "${{ secrets.SNOWFLAKE_USER }}"
          password = "${{ secrets.SNOWFLAKE_PAT }}"
          EOF
          chmod 600 ~/.snowflake/connections.toml

      - name: Install Cortex Code CLI
        run: |
          curl -LsS https://ai.snowflake.com/static/cc-scripts/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Cortex Code semantic view review
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          cortex --bypass -p "Use the semantic-view-authoring skill to review these changed semantic view model(s): ${CHANGED_FILES}. Check clause order; that every logical table has a PRIMARY KEY and every join is declared in RELATIONSHIPS; that every metric and dimension has WITH SYNONYMS; that every metric (and any ambiguous fact) has a definition COMMENT; that at least two AI_VERIFIED_QUERIES exist using the unqualified view name. Output a concise markdown review with file:line references and concrete fixes. Do not modify any files." \
            > review.md 2>/dev/null || true
          echo "----- review.md -----"; cat review.md

      - name: Post review as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Semantic View review (Cortex Code)\n\n';
            try { body += fs.readFileSync('review.md', 'utf8'); }
            catch (e) { body += '_No review output produced._'; }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
