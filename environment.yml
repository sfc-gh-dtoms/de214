# Recreates the local toolchain used to develop and deploy this demo.
#
#   conda env create -f environment.yml
#   conda activate de214
#
# Notes:
#   * dbt "1.10.15" refers to dbt-core; the Snowflake adapter's 1.10 line tops
#     out at 1.10.7 (they are versioned independently).
#   * snowflake-connector-python is pinned to 4.4.0 on purpose: snowflake-cli
#     3.17.1 pins it, and 4.4.0 ships a prebuilt wheel for macOS arm64 / py3.11
#     (4.5.0 does not, which forces a source build that fails locally).
#   * snowflake-cli pins protobuf<6 while dbt-common prefers >=6; protobuf 5.29.6
#     is used and dbt runs fine with it.

name: de214
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - dbt-core==1.10.15
      - dbt-snowflake==1.10.7
      - snowflake-cli==3.17.1
      - snowflake-connector-python[secure-local-storage]==4.4.0
      - snowflake-snowpark-python==1.41.0
